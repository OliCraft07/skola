<!doctype html>
<html lang="sk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0D0D0F">
<title>Príprava na písomky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Jeden tmavý systém, jedno písmo, jedna žltá na dôležité veci (blížiaca sa písomka, zameranie). Žiadne karty:
   zoznam je tabuľka riadkov s dátumom vľavo. Farba predmetu je malý štvorček pri jeho názve. */
:root {
  --bg: #0D0D0F;
  --raise: #141417;
  --ink: #EAEAEC;
  --muted: #8E8E96;
  --rule: #232328;
  --edge: #313138;
  --accent: #F5C542;
  --mark: #5B4A12;
  --font: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--font); }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.page {
  max-width: 720px; margin: 0 auto; padding-block: 44px 90px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* hlavička */
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 26px; }
h1 { margin: 0; font: 700 clamp(1.9rem, 7vw, 2.7rem)/1.04 var(--font); letter-spacing: -.035em; text-wrap: balance; }
.today { color: var(--muted); font-size: .9rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* hľadanie a filter */
.ctl { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); padding: 6px 0 12px; }
.search { position: relative; display: block; }
.search input {
  width: 100%; height: 50px; padding: 0 46px 0 15px; background: var(--raise); border: 1px solid var(--edge);
  border-radius: 8px; font-size: 1rem; -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--muted); opacity: 1; }
.search input::-webkit-search-cancel-button { display: none; }
.search input:focus-visible { outline: 0; border-color: var(--accent); }
.key {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none;
  min-width: 22px; text-align: center; padding: 2px 6px; border: 1px solid var(--edge); border-radius: 4px; color: var(--muted); font-size: .78rem;
}
@media (hover: none) { .key { display: none; } }
.search input:not(:placeholder-shown) ~ .key { display: none; }
.clear {
  position: absolute; right: 3px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px;
  border: 0; background: none; color: var(--muted); font-size: 1.4rem; line-height: 1; cursor: pointer;
}
.clear:hover { color: var(--ink); }
.search input:placeholder-shown ~ .clear { display: none; }

.meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; margin-top: 12px; }
.meta:has(.subj[hidden]) { margin-top: 8px; justify-content: flex-end; }
.subj { display: flex; flex-wrap: wrap; gap: 8px; }
.subj button {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 13px; cursor: pointer;
  background: transparent; border: 1px solid var(--edge); border-radius: 6px; color: var(--muted); font-weight: 500; font-size: .92rem;
}
.subj button:hover { color: var(--ink); border-color: var(--muted); }
.subj button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.subj button sup { font-size: .72rem; font-weight: 400; opacity: .7; }
.count { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }

/* subjekt: farba z odtieňa --h */
.sq { width: 8px; height: 8px; border-radius: 1px; background: hsl(var(--h) 62% 62%); flex: none; display: inline-block; }
.sj { display: inline-flex; align-items: center; gap: 8px; color: hsl(var(--h) 62% 70%); font-weight: 500; }

/* zoznam */
.list { border-top: 1px solid var(--edge); }
.row {
  display: grid; grid-template-columns: 84px minmax(0, 1fr) 22px; gap: 0 20px; align-items: start;
  padding: 20px 0 21px; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; min-width: 0;
}
.when { display: grid; gap: 1px; align-content: start; padding-top: 2px; font-variant-numeric: tabular-nums; }
.when b { font-weight: 700; font-size: 1.12rem; line-height: 1.25; letter-spacing: -.01em; white-space: nowrap; }
.when span { color: var(--muted); font-size: .8rem; line-height: 1.35; }
.row.hot .when b { color: var(--accent); }
.row.hot .when span { color: var(--accent); font-weight: 600; }
.main { min-width: 0; display: grid; gap: 5px; }
.row h2 { margin: 0; font: 600 1.28rem/1.22 var(--font); letter-spacing: -.02em; overflow-wrap: anywhere; text-wrap: balance; }
.row h2 span {
  background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
  padding-bottom: 2px;
}
.kind { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: .85rem; color: var(--muted); }
.desc {
  margin: 2px 0 0; color: var(--muted); font-size: .94rem; max-width: 58ch; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
}
.hit { margin: 2px 0 0; font-size: .82rem; color: var(--muted); }
.arrow { justify-self: end; padding-top: 3px; color: var(--muted); font-size: 1.25rem; line-height: 1.2; }
a.row:hover h2 span { background-size: 100% 1px; }
a.row:hover .arrow { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .row h2 span { transition: background-size .28s ease; }
  .arrow { transition: transform .16s ease, color .16s ease; }
  a.row:hover .arrow { transform: translateX(4px); }
  a.row:active .arrow { transform: translateX(8px); }
}
.row.soon h2, .row.soon .desc { color: var(--muted); }
mark { background: var(--mark); color: var(--ink); padding: 0 2px; border-radius: 2px; }

.empty { padding: 40px 0 16px; color: var(--muted); }
.empty b { color: var(--ink); font-weight: 600; }
.empty button { margin-left: 8px; border: 0; background: none; padding: 8px 0; color: var(--accent); font-weight: 600; text-decoration: underline; cursor: pointer; }
.foot { margin: 36px 0 0; color: var(--muted); font-size: .82rem; }

@media (max-width: 520px) {
  .page { padding-top: 30px; }
  .row { grid-template-columns: 72px minmax(0, 1fr) 18px; gap: 0 14px; }
  .row h2 { font-size: 1.18rem; }
  .today { font-size: .82rem; }
  /* filter predmetov v jednom riadku, ktorý sa dá posúvať prstom */
  .subj { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -20px; padding-inline: 20px; width: calc(100% + 40px); }
  .subj::-webkit-scrollbar { display: none; }
  .subj button { flex: none; }
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1>Príprava na písomky</h1>
    <span class="today" id="today"></span>
  </header>

  <div class="ctl">
    <label class="search">
      <span hidden>Hľadať</span>
      <input id="q" type="search" placeholder="Hľadať písomku, autora, dielo…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-controls="list">
      <span class="key" aria-hidden="true">/</span>
      <button class="clear" id="clear" type="button" aria-label="Vymazať hľadanie">×</button>
    </label>
    <div class="meta">
      <nav class="subj" id="subjects" aria-label="Predmet"></nav>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>

  <div class="list" id="list"></div>
  <p class="empty" id="empty" hidden></p>

  <p class="foot">Priebeh a odpovede sa ukladajú iba v tomto prehliadači.</p>
</div>

<script>
/* ---------- MATERIÁLY ----------
   Nový materiál = jeden objekt v poli TOPICS. Súbor dáš do priečinka predmetu (napr. slovencina/) a sem pridáš:
     subject – názov predmetu; z neho sa sám vytvorí filter (zobrazí sa, keď sú predmety aspoň dva) a farba štvorčeka
     title   – nadpis (bez pomlčky; autora a druh daj do kind)
     desc    – 1 až 2 vety, o čom to je
     tags    – kľúčové slová pre vyhľadávanie (autor, dielo, obdobie…)
     url     – cesta k súboru
     date    – termín písomky 'RRRR-MM-DD'; zoznam je zoradený podľa neho (najbližšie hore, minulé pod nimi)
     kind    – druh a prípadne autor (Test, Ťahák · J. D. Salinger…)
     soon    – true, kým stránka nie je hotová; zobrazí sa, ale nedá sa otvoriť */
const TOPICS = [
  {
    subject: 'Slovenčina',
    title: 'Maturitné testy 2024 a 2025',
    desc: 'Otázky z oboch testov externej časti, ktoré sa dajú vyriešiť bez čítania celej ukážky. Odpovedáš, kontroluješ podľa oficiálneho kľúča a priebeh sa ti uloží.',
    tags: ['test', 'externá časť', 'maturita', 'jazyk', 'literatúra', '2024', '2025', 'cvičenie', 'opakovanie', 'SJL'],
    url: 'slovencina/maturita-24-25.html',
    date: '2026-10-25', /* približne, uprav podľa skutočného termínu */
    kind: 'Opakovanie'
  },
  {
    subject: 'Slovenčina',
    title: 'Kto chytá v žite',
    desc: 'Ťahák na písomku: celý dej kapitolu po kapitole, postavy, symboly, otázky „prečo?“ a testy v troch úrovniach.',
    tags: ['Salinger', 'J. D. Salinger', 'The Catcher in the Rye', 'Holden Caulfield', 'ťahák', 'písomka', 'próza', 'americká literatúra', 'dielo', 'test', 'ultra ťažký test', 'dopisovačky', 'plagát', 'mapa vzťahov', 'citáty', 'pasce'],
    url: 'slovencina/salinger-kto-chyta-v-zite.html',
    date: '2026-11-09',
    kind: 'Ťahák · J. D. Salinger'
  }
];

/* farby predmetov: pevný odtieň pre známe, ostatné sa vyberú podľa názvu (stále rovnaké) */
const HUES = { 'Slovenčina': 12 };
const PALETTE = [205, 150, 275, 40, 335, 175, 95, 250];

(function () {
  /* normalizácia znak po znaku (bez diakritiky, malé písmená), aby sa dĺžka nemenila a zvýraznenie sedelo */
  const norm = s => Array.from(s).map(c => (c.normalize('NFD')[0] || c).toLowerCase()).join('');
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = id => document.getElementById(id);
  const list = $('list'), input = $('q'), empty = $('empty'), count = $('count'), seg = $('subjects');
  let subject = '';

  const hue = name => {
    if (HUES[name] !== undefined) return HUES[name];
    let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return PALETTE[h % PALETTE.length];
  };

  /* termíny */
  const DAY = 864e5;
  const WD = ['nedeľa', 'pondelok', 'utorok', 'streda', 'štvrtok', 'piatok', 'sobota'], WDS = ['ne', 'po', 'ut', 'st', 'št', 'pi', 'so'];
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const toDate = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const noun = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4) ? few : many;
  const diff = s => Math.round((toDate(s) - today) / DAY);
  function rel(n) {
    if (n === 0) return 'dnes';
    if (n === 1) return 'zajtra';
    if (n === -1) return 'včera';
    if (n > 1 && n < 14) return 'o ' + n + ' ' + noun(n, 'deň', 'dni', 'dní');
    if (n >= 14) { const w = Math.round(n / 7); return 'o ' + w + ' ' + noun(w, 'týždeň', 'týždne', 'týždňov'); }
    const k = -n;
    if (k < 14) return 'pred ' + k + ' dňami';
    if (k < 60) { const w = Math.round(k / 7); return 'pred ' + w + ' ' + (w === 1 ? 'týždňom' : 'týždňami'); }
    const m = Math.round(k / 30);
    return 'pred ' + m + ' ' + (m === 1 ? 'mesiacom' : 'mesiacmi');
  }
  const dateLabel = d => d.getDate() + '. ' + (d.getMonth() + 1) + '.' + (d.getFullYear() !== today.getFullYear() ? ' ' + d.getFullYear() : '');

  $('today').textContent = WD[today.getDay()] + ' ' + dateLabel(today);

  /* jeden zoznam podľa času: najbližšie písomky hore, minulé pod nimi (od najnovšej), bez termínu na konci */
  const prep = TOPICS.map(t => Object.assign({}, t, {
    n: t.date ? diff(t.date) : null,
    hay: norm([t.subject, t.title, t.desc, t.kind || '', (t.tags || []).join(' ')].join(' '))
  })).sort((a, b) => {
    const g = t => t.n === null ? 2 : t.n >= 0 ? 0 : 1;
    if (g(a) !== g(b)) return g(a) - g(b);
    return g(a) === 0 ? a.n - b.n : b.n - a.n;
  });
  const subjects = Array.from(new Set(prep.map(t => t.subject)));

  /* zvýraznenie hľadaných slov */
  function mark(text, words) {
    if (!words.length) return esc(text);
    const n = norm(text), chars = Array.from(text), on = new Array(chars.length).fill(false);
    words.forEach(w => {
      let i = n.indexOf(w);
      while (i !== -1) { for (let k = i; k < i + w.length; k++) on[k] = true; i = n.indexOf(w, i + w.length); }
    });
    let res = '', open = false;
    chars.forEach((c, i) => {
      if (on[i] && !open) { res += '<mark>'; open = true; }
      if (!on[i] && open) { res += '</mark>'; open = false; }
      res += esc(c);
    });
    return res + (open ? '</mark>' : '');
  }

  function row(t, words) {
    const hot = t.n !== null && t.n >= 0 && t.n <= 2;
    const el = document.createElement(t.soon ? 'div' : 'a');
    el.className = 'row' + (hot ? ' hot' : '') + (t.soon ? ' soon' : '');
    el.style.setProperty('--h', hue(t.subject));
    if (!t.soon) el.href = t.url;

    let when;
    if (t.n !== null) {
      const d = toDate(t.date);
      when = '<div class="when"><b>' + dateLabel(d) + '</b><span>' + (t.n >= 0 ? WDS[d.getDay()] + ' · ' : '') + rel(t.n) + '</span></div>';
    } else {
      when = '<div class="when"><b>–</b><span>bez termínu</span></div>';
    }
    const hits = words.length ? (t.tags || []).filter(k => words.some(w => norm(k).indexOf(w) !== -1)) : [];
    el.innerHTML = when +
      '<div class="main"><h2><span>' + mark(t.title, words) + '</span></h2>' +
      '<div class="kind"><span class="sj"><i class="sq"></i>' + esc(t.subject) + '</span>' +
      (t.kind ? '<span>' + mark(t.kind, words) + '</span>' : '') + (t.soon ? '<span>pripravuje sa</span>' : '') + '</div>' +
      '<p class="desc">' + mark(t.desc, words) + '</p>' +
      (hits.length ? '<p class="hit">' + hits.map(k => '#' + mark(k, words)).join('  ') + '</p>' : '') + '</div>' +
      '<span class="arrow" aria-hidden="true">' + (t.soon ? '' : '→') + '</span>';
    return el;
  }

  function render() {
    const raw = input.value.trim();
    const words = norm(raw).split(/\s+/).filter(Boolean);
    const found = prep.filter(t => (!subject || t.subject === subject) && words.every(w => t.hay.indexOf(w) !== -1));

    list.textContent = '';
    found.forEach(t => list.appendChild(row(t, words)));
    list.hidden = !found.length;

    const mat = n => n + ' ' + noun(n, 'materiál', 'materiály', 'materiálov');
    count.textContent = (raw || subject) ? found.length + ' z ' + prep.length : mat(prep.length);
    empty.hidden = found.length > 0;
    if (!found.length) {
      empty.innerHTML = (raw ? 'Nič sa nenašlo pre <b>„' + esc(raw) + '“</b>' + (subject ? ' v predmete ' + esc(subject) : '') + '.' : 'V tomto predmete zatiaľ nič nie je.') +
        '<button type="button" id="reset">Zrušiť filter</button>';
      $('reset').addEventListener('click', () => { input.value = ''; setSubject(''); input.focus(); });
    }
    try {
      const u = new URL(location.href);
      raw ? u.searchParams.set('q', raw) : u.searchParams.delete('q');
      subject ? u.searchParams.set('p', subject) : u.searchParams.delete('p');
      history.replaceState(null, '', u);
    } catch (e) {}
  }

  /* filter predmetov sa zobrazí, až keď je predmetov viac ako jeden */
  function setSubject(s) {
    subject = s;
    Array.from(seg.children).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === s)));
    render();
  }
  function buildSubjects() {
    if (subjects.length < 2) { seg.hidden = true; return; }
    [''].concat(subjects).forEach(s => {
      const b = document.createElement('button');
      b.type = 'button'; b.dataset.s = s;
      const n = s ? prep.filter(t => t.subject === s).length : prep.length;
      b.innerHTML = (s ? '<i class="sq" style="--h:' + hue(s) + '"></i>' : '') + esc(s || 'Všetko') + '<sup>' + n + '</sup>';
      b.setAttribute('aria-pressed', String(s === subject));
      b.addEventListener('click', () => setSubject(s));
      seg.appendChild(b);
    });
  }

  input.addEventListener('input', render);
  $('clear').addEventListener('click', () => { input.value = ''; render(); input.focus(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape' && input.value) { input.value = ''; render(); }
    if (e.key === 'Enter') { const a = list.querySelector('a.row'); if (a) a.click(); }
  });
  document.addEventListener('keydown', e => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && tag !== 'INPUT' && tag !== 'TEXTAREA') {
      e.preventDefault(); input.focus(); input.select();
    }
  });

  try {
    const u = new URL(location.href);
    input.value = u.searchParams.get('q') || '';
    const p = u.searchParams.get('p'); if (p && subjects.indexOf(p) !== -1) subject = p;
  } catch (e) {}
  buildSubjects();
  render();
})();
</script>
</body>
</html>
