<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Maturitné témy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<style>
/* Rovnaká paleta a písma ako v stránke s opakovaním z SJL, aby všetky témy pôsobili ako jedna sada.
   Landing page je zoznam kariet, ktoré sa dajú filtrovať predmetom a prehľadávať. */
:root {
  --bg: #EEF1F8;
  --surface: #FFFFFF;
  --paper: #F7F8FD;
  --ink: #141B33;
  --muted: #586179;
  --line: #D5DAE7;
  --box: #E2E6F1;
  --accent: #1B3CC2;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EBFC;
  --mark: #FFE9A8;
  --display: 'Literata', Georgia, 'Times New Roman', serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1118; --surface: #161B26; --paper: #111620; --ink: #E8EBF4; --muted: #9AA3BA; --line: #283042;
    --box: #252C3C; --accent: #8EA4FF; --accent-ink: #0E1118; --accent-soft: #1E2640; --mark: #5A4A12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1118; --surface: #161B26; --paper: #111620; --ink: #E8EBF4; --muted: #9AA3BA; --line: #283042;
  --box: #252C3C; --accent: #8EA4FF; --accent-ink: #0E1118; --accent-soft: #1E2640; --mark: #5A4A12;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.page {
  max-width: 920px; margin: 0 auto; padding-block: 36px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* úvod */
.eyebrow { margin: 0 0 8px; font: 500 .74rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 clamp(2rem, 7vw, 3rem)/1.06 var(--display); margin: 0 0 12px; text-wrap: balance; letter-spacing: -.01em; }
.sub { margin: 0 0 22px; color: var(--muted); max-width: 58ch; }

/* lišta s vyhľadávaním */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg);
  padding: 10px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; display: grid; gap: 10px;
}
.search { position: relative; }
.search input {
  width: 100%; font: 400 1.05rem/1.3 var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 13px 44px 13px 14px; min-height: 48px;
  -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border: 0; background: transparent; color: var(--muted);
  font: 500 1.3rem/1 var(--body); cursor: pointer; border-radius: 5px;
}
.clear:hover { color: var(--accent); }
.kbd {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none;
  font: 500 .72rem/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px;
}
@media (hover: none) { .kbd { display: none; } }
.search input:not(:placeholder-shown) ~ .kbd { display: none; }
.search input:placeholder-shown ~ .clear { display: none; }

.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button {
  font: 500 .88rem/1 var(--body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; cursor: pointer; min-height: 40px;
}
.seg button:hover { border-color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg button span { font: 500 .78rem/1 var(--mono); opacity: .75; margin-left: 4px; }
.count { font: 500 .78rem/1 var(--mono); color: var(--muted); letter-spacing: .03em; }
.count b { color: var(--ink); font-weight: 500; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* zoznam tém */
.grp {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  margin: 28px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--ink);
  font: 700 1.4rem/1.2 var(--display);
}
.grp:first-child { margin-top: 0; }
.grp span { font: 500 .78rem/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; }

.topic {
  display: grid; gap: 10px; align-content: start; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px;
  color: inherit; text-decoration: none;
}
a.topic:hover { border-color: var(--accent); }
a.topic:hover .go { color: var(--accent); }
.topic.soon { background: var(--paper); border-style: dashed; }
.top { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.tag {
  display: inline-block; font: 500 .7rem/1 var(--mono); letter-spacing: .05em; text-transform: uppercase;
  padding: 5px 8px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); width: max-content;
}
.tag.s { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tag.n { color: var(--ink); background: var(--box); border-color: var(--box); }
.topic h2 { margin: 0; font: 700 1.25rem/1.25 var(--display); overflow-wrap: anywhere; }
.topic p { margin: 0; color: var(--muted); font-size: .95rem; overflow-wrap: anywhere; }
.kw { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 400 .78rem/1.4 var(--mono); color: var(--muted); }
.go { margin-top: 2px; font: 600 .86rem/1 var(--body); color: var(--ink); }
.topic.soon .go { color: var(--muted); font-weight: 500; }
mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 2px; }

.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.empty b { color: var(--ink); }
.foot { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--line); font: 400 .78rem/1.5 var(--mono); color: var(--muted); }

@media (max-width: 520px) {
  .page { padding-top: 24px; }
  .topic { padding: 14px; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="eyebrow">Škola · opakovanie</p>
    <h1>Maturitné témy</h1>
    <p class="sub">Všetky témy na jednom mieste. Vyber predmet alebo vyhľadaj tému podľa názvu, autora či kľúčového slova.</p>
  </header>

  <div class="bar">
    <div class="search" role="search">
      <input id="q" type="search" placeholder="Hľadať tému, autora, dielo…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Hľadať v témach" aria-controls="out">
      <span class="kbd" aria-hidden="true">/</span>
      <button class="clear" id="clear" type="button" aria-label="Vymazať hľadanie">×</button>
    </div>
    <div class="row">
      <div class="seg" id="subjects" role="group" aria-label="Predmet"></div>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>

  <main id="out"></main>
  <p class="empty" id="empty" hidden></p>

  <p class="foot">Priebeh a odpovede sa ukladajú iba v tomto prehliadači.</p>
</div>

<script>
/* ---------- TÉMY ----------
   Nová téma = jeden objekt v poli TOPICS. Súbor dáš do priečinka predmetu (napr. slovencina/) a sem pridáš:
     subject – názov predmetu (podľa neho sa tvoria filtre a skupiny)
     title   – nadpis karty
     desc    – 1 až 2 vety, o čom téma je
     tags    – kľúčové slová pre vyhľadávanie (autor, dielo, obdobie…)
     url     – cesta k súboru
     kind    – krátky štítok na karte (Test, Dielo, Zhrnutie…)
     soon    – true, kým stránka ešte nie je hotová; karta sa zobrazí, ale nedá sa otvoriť */
const TOPICS = [
  {
    subject: 'Slovenčina',
    title: 'Maturita 2024 a 2025 – opakovanie z SJL',
    desc: 'Otázky z oboch testov externej časti, ktoré sa dajú vyriešiť bez čítania celej ukážky. Odpovedáš, kontroluješ podľa oficiálneho kľúča a priebeh sa ti uloží.',
    tags: ['test', 'externá časť', 'maturita', 'jazyk', 'literatúra', '2024', '2025', 'cvičenie'],
    url: 'slovencina/maturita-24-25.html',
    kind: 'Test'
  },
  {
    subject: 'Slovenčina',
    title: 'J. D. Salinger – Kto chytá v žite',
    desc: 'Ťahák na písomku: celý dej kapitolu po kapitole, postavy, symboly, otázky „prečo?“ a testy v troch úrovniach.',
    tags: ['Salinger', 'Kto chytá v žite', 'The Catcher in the Rye', 'Holden Caulfield', 'ťahák', 'próza', 'americká literatúra', 'dielo', 'test'],
    url: 'slovencina/salinger-kto-chyta-v-zite.html',
    kind: 'Ťahák'
  }
];

(function () {
  /* normalizácia znak po znaku (bez diakritiky, malé písmená), aby sa dĺžka reťazca nemenila
     a zvýraznenie sedelo na pôvodný text */
  const norm = s => Array.from(s).map(c => (c.normalize('NFD')[0] || c).toLowerCase()).join('');
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = id => document.getElementById(id);

  const input = $('q'), out = $('out'), empty = $('empty'), count = $('count'), seg = $('subjects');
  let subject = '';

  const prep = TOPICS.map(t => Object.assign({}, t, {
    hay: norm([t.subject, t.title, t.desc, t.kind || '', (t.tags || []).join(' ')].join(' '))
  }));
  const subjects = Array.from(new Set(TOPICS.map(t => t.subject)));

  /* zvýraznenie hľadaných slov v texte */
  function mark(text, words) {
    if (!words.length) return esc(text);
    const n = norm(text);
    /* indexy sú po bodoch kódu, preto pracujeme s poľom znakov */
    const chars = Array.from(text);
    const flags = new Array(chars.length).fill(false);
    words.forEach(w => {
      let i = n.indexOf(w);
      while (i !== -1) { for (let k = i; k < i + w.length; k++) flags[k] = true; i = n.indexOf(w, i + w.length); }
    });
    let res = '', open = false;
    chars.forEach((c, i) => {
      if (flags[i] && !open) { res += '<mark>'; open = true; }
      if (!flags[i] && open) { res += '</mark>'; open = false; }
      res += esc(c);
    });
    return res + (open ? '</mark>' : '');
  }

  function card(t, words) {
    const inner =
      '<div class="top"><span class="tag s">' + esc(t.subject) + '</span>' +
      (t.kind ? '<span class="tag n">' + esc(t.kind) + '</span>' : '') +
      (t.soon ? '<span class="tag">Čoskoro</span>' : '') + '</div>' +
      '<h2>' + mark(t.title, words) + '</h2>' +
      '<p>' + mark(t.desc, words) + '</p>' +
      ((t.tags && t.tags.length) ? '<div class="kw">' + t.tags.map(k => '<span>#' + mark(k, words) + '</span>').join('') + '</div>' : '') +
      '<span class="go">' + (t.soon ? 'Pripravuje sa' : 'Otvoriť →') + '</span>';
    const el = document.createElement(t.soon ? 'div' : 'a');
    el.className = 'topic' + (t.soon ? ' soon' : '');
    if (!t.soon) el.href = t.url;
    el.innerHTML = inner;
    return el;
  }

  function render() {
    const raw = input.value.trim();
    const words = norm(raw).split(/\s+/).filter(Boolean);
    const found = prep.filter(t => (!subject || t.subject === subject) && words.every(w => t.hay.indexOf(w) !== -1));

    out.textContent = '';
    subjects.forEach(s => {
      const items = found.filter(t => t.subject === s);
      if (!items.length) return;
      if (subjects.length > 1 || !subject) {
        const h = document.createElement('h2');
        h.className = 'grp';
        h.innerHTML = esc(s) + '<span>' + items.length + ' ' + plural(items.length) + '</span>';
        out.appendChild(h);
      }
      const g = document.createElement('div');
      g.className = 'grid';
      items.forEach(t => g.appendChild(card(t, words)));
      out.appendChild(g);
    });

    count.innerHTML = '<b>' + found.length + '</b> / ' + TOPICS.length + ' ' + plural(TOPICS.length);
    empty.hidden = found.length > 0;
    if (!found.length) {
      empty.innerHTML = raw
        ? 'Nič sa nenašlo pre <b>' + esc(raw) + '</b>' + (subject ? ' v predmete ' + esc(subject) : '') + '.'
        : 'V tomto predmete zatiaľ nie je žiadna téma.';
    }
    try {
      const u = new URL(location.href);
      raw ? u.searchParams.set('q', raw) : u.searchParams.delete('q');
      history.replaceState(null, '', u);
    } catch (e) {}
  }

  function plural(n) { return n === 1 ? 'téma' : (n >= 2 && n <= 4) ? 'témy' : 'tém'; }

  /* filtre podľa predmetu: zobrazia sa, až keď je predmetov viac ako jeden */
  function buildSubjects() {
    if (subjects.length < 2) { seg.hidden = true; return; }
    const defs = [['', 'Všetky', TOPICS.length]].concat(subjects.map(s => [s, s, TOPICS.filter(t => t.subject === s).length]));
    defs.forEach(d => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = esc(d[1]) + '<span>' + d[2] + '</span>';
      b.setAttribute('aria-pressed', String(d[0] === subject));
      b.addEventListener('click', () => {
        subject = d[0];
        Array.from(seg.children).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        render();
      });
      seg.appendChild(b);
    });
  }

  input.addEventListener('input', render);
  $('clear').addEventListener('click', () => { input.value = ''; render(); input.focus(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape' && input.value) { input.value = ''; render(); }
    if (e.key === 'Enter') {
      const first = out.querySelector('a.topic');
      if (first) first.click();
    }
  });
  document.addEventListener('keydown', e => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && tag !== 'INPUT' && tag !== 'TEXTAREA') {
      e.preventDefault(); input.focus(); input.select();
    }
  });

  try { input.value = new URL(location.href).searchParams.get('q') || ''; } catch (e) {}
  buildSubjects();
  render();
})();
</script>
</body>
</html>
